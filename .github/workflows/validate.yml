name: Validate and publish HomeLab catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate and build catalog
        run: ./scripts/validate-repository.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homelab-catalog
          path: dist/
          if-no-files-found: error

  publish:
    name: Verify immutable public catalog artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: homelab-catalog-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build catalog
        run: ./scripts/validate-repository.sh

      - name: Verify checked-in catalog
        run: |
          cmp --silent catalog.json dist/catalog.json
          cmp --silent catalog.json.sha256 dist/catalog.json.sha256

      - name: Verify immutable public URL
        id: publish
        shell: bash
        run: |
          digest="$(tr -d '\n' < catalog.json.sha256)"
          public_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/catalog.json"
          curl --fail --location --retry 5 --retry-all-errors "$public_url" --output /tmp/public-catalog.json
          actual="sha256:$(sha256sum /tmp/public-catalog.json | cut -d' ' -f1)"
          test "$actual" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "url=$public_url" >> "$GITHUB_OUTPUT"

      - name: Report immutable catalog reference
        run: echo "Verified ${{ steps.publish.outputs.url }} (${{ steps.publish.outputs.digest }})" >> "$GITHUB_STEP_SUMMARY"
