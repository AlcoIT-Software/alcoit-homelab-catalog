<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Jellyfin en AlcoItAppStore</title>
  <desc id="description">Banner oscuro con el símbolo de Jellyfin y una biblioteca multimedia.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091224"/>
      <stop offset="0.55" stop-color="#171a4b"/>
      <stop offset="1" stop-color="#5426a8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00a4dc"/>
      <stop offset="1" stop-color="#aa5cc3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#background)"/>
  <circle cx="1080" cy="110" r="210" fill="#7f4cff" opacity=".12"/>
  <circle cx="960" cy="650" r="300" fill="#00b8e6" opacity=".08"/>
  <g transform="translate(92 94)" filter="url(#shadow)">
    <rect width="400" height="487" rx="34" fill="#0d1428" stroke="#fff" stroke-opacity=".1"/>
    <rect x="28" y="28" width="344" height="226" rx="22" fill="#131f3d"/>
    <path d="M200 65 306 226H94Z" fill="none" stroke="url(#brand)" stroke-width="34" stroke-linejoin="round"/>
    <path d="m200 121 48 73h-96Z" fill="url(#brand)"/>
    <rect x="28" y="278" width="162" height="181" rx="20" fill="#202b4d"/>
    <rect x="210" y="278" width="162" height="84" rx="20" fill="#32245f"/>
    <rect x="210" y="382" width="162" height="77" rx="20" fill="#143d5b"/>
  </g>
  <g fill="#fff">
    <text x="560" y="238" font-family="Inter,Segoe UI,sans-serif" font-size="76" font-weight="750">Jellyfin</text>
    <text x="564" y="304" font-family="Inter,Segoe UI,sans-serif" font-size="29" fill="#c6cce1">Tu contenido, bajo tu control.</text>
  </g>
  <g transform="translate(560 378)">
    <rect width="245" height="62" rx="31" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".15"/>
    <circle cx="35" cy="31" r="10" fill="#32d9ff"/>
    <text x="58" y="40" font-family="Inter,Segoe UI,sans-serif" font-size="23" fill="#eef1ff">Media privada</text>
  </g>
  <text x="564" y="540" font-family="Inter,Segoe UI,sans-serif" font-size="22" letter-spacing="4" fill="#a9b2d4">ALCOIT APP STORE</text>
</svg>
