    <path d="M210 51 354 105v121c0 105-59 190-144 232C125 416 66 331 66 226V105Z" fill="url(#shield)"/>
    <path d="M210 85 320 126v98c0 81-43 147-110 185-67-38-110-104-110-185v-98Z" fill="#092b50"/>
    <circle cx="210" cy="205" r="31" fill="#5ce0ff"/>
    <circle cx="142" cy="281" r="19" fill="#fff"/>
    <circle cx="278" cy="281" r="19" fill="#fff"/>
    <path d="M210 236v45m-49 0h98" fill="none" stroke="#8fe9ff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g fill="#fff">
    <text x="565" y="238" font-family="Inter,Segoe UI,sans-serif" font-size="76" font-weight="750">Pi-hole</text>
    <text x="569" y="304" font-family="Inter,Segoe UI,sans-serif" font-size="29" fill="#c5ddf2">Filtrado DNS para toda tu red.</text>
  </g>
  <g transform="translate(565 378)">
