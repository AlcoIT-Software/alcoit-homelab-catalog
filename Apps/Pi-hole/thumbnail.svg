<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Pi-hole en AlcoItAppStore</title>
  <desc id="description">Banner azul con un escudo de red que representa el filtrado DNS.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061526"/>
      <stop offset="0.55" stop-color="#092d55"/>
      <stop offset="1" stop-color="#0860a7"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54d6ff"/>
      <stop offset="1" stop-color="#2476ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#background)"/>
  <circle cx="1090" cy="100" r="220" fill="#32c9ff" opacity=".1"/>
  <circle cx="1020" cy="690" r="320" fill="#2373ff" opacity=".12"/>
  <g transform="translate(86 84)" filter="url(#shadow)">
