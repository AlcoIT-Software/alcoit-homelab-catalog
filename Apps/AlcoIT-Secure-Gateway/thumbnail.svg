<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">AlcoIT Secure Gateway en AlcoItAppStore</title>
  <desc id="description">Banner azul de una puerta de enlace HTTPS común para aplicaciones HomeLab.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset="0.58" stop-color="#0a3b55"/>
      <stop offset="1" stop-color="#087d8f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75e6ff"/>
      <stop offset="1" stop-color="#1689c8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#background)"/>
  <circle cx="1090" cy="85" r="245" fill="#64e1ff" opacity=".1"/>
  <circle cx="1010" cy="690" r="335" fill="#21b6ce" opacity=".08"/>
  <g transform="translate(105 82)" filter="url(#shadow)">
    <rect width="390" height="510" rx="42" fill="#061522" stroke="#fff" stroke-opacity=".12"/>
    <path d="M195 62 310 104v102c0 107-47 178-115 219-68-41-115-112-115-219V104Z" fill="url(#shield)"/>
    <path d="M195 98 279 129v76c0 80-31 133-84 171-53-38-84-91-84-171v-76Z" fill="#09243a"/>
    <circle cx="195" cy="220" r="42" fill="#eafaff"/>
    <rect x="174" y="250" width="42" height="66" rx="18" fill="#eafaff"/>
    <g fill="#75e6ff">
      <circle cx="43" cy="165" r="16"/>
      <circle cx="43" cy="337" r="16"/>
      <circle cx="347" cy="251" r="16"/>
    </g>
    <g fill="none" stroke="#75e6ff" stroke-width="8" stroke-linecap="round">
      <path d="M59 165h64"/>
      <path d="M59 337h77"/>
      <path d="M269 251h62"/>
    </g>
  </g>
  <g fill="#fff">
    <text x="555" y="210" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="750">AlcoIT Secure</text>
    <text x="555" y="282" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="750">Gateway</text>
    <text x="560" y="344" font-family="Inter,Segoe UI,sans-serif" font-size="27" fill="#c9f1f8">Un solo acceso HTTPS para tus aplicaciones.</text>
  </g>
  <g transform="translate(560 397)">
    <rect width="330" height="62" rx="31" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".15"/>
    <circle cx="35" cy="31" r="10" fill="#75e6ff"/>
    <text x="58" y="40" font-family="Inter,Segoe UI,sans-serif" font-size="23" fill="#eefcff">Administrado por HomeApp</text>
  </g>
  <text x="564" y="540" font-family="Inter,Segoe UI,sans-serif" font-size="22" letter-spacing="4" fill="#a9dce7">ALCOIT APP STORE</text>
</svg>
